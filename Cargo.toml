[package]
name = "sheetgraph"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Extract spreadsheets (Google Sheets, xlsx, csv) into a compact map an LLM can read, plus a formula dependency graph"
license = "MIT OR Apache-2.0"
repository = "https://github.com/asharma327/spreadsheet-extractor"
readme = "README.md"
keywords = ["spreadsheet", "excel", "xlsx", "google-sheets", "llm"]
categories = ["command-line-utilities", "parser-implementations", "text-processing"]
exclude = ["/.github", "/tests/fixtures/*.py"]

[dependencies]
anyhow = "1.0.104"
calamine = "0.37.0"
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
flate2 = "1.1.10"
jsonwebtoken = "9"
# quick-xml and zip: the versions calamine uses, for the xlsx parts it doesn't read.
quick-xml = "0.42"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "gzip"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
zip = { version = "9", default-features = false, features = ["deflate"] }
